
# For reminder-api

schema:

    # Register a periodic task in _honker_scheduler_tasks.
    task:
        name: unique per-scheduler identifier. A second add with the same name replaces the first registration entirely (including cron expr, queue, payload).
        queue: the queue to enqueue into on each boundary.
        schedule: a CronSchedule from crontab(expr) or every_s(n).
        payload: the payload for enqueued jobs. Default None.
        priority: enqueue priority for fired jobs.
        expires: how many seconds a fired job stays claimable. queue.sweep_expired() moves expired rows into _honker_dead.

    # Let reminder be defined as subset of task

    reminder:
        name: "rem-uuid"    # posted as sequence-id to ntfy
        queue: "reminders"  #  also the topic name for ntfy
        schedule:           # as mentioned in task, sent AND validated by client, generated by LLM from natural language
        payload:            # see ntfy schema
        priority:           # for now, will use default, all reminders jobs will be treated the same, prioirty is already defined in payload
        expires:            # idk, maybe use default

    ntfy:
        topic: "reminders"  # hardcoded
        sequence_id: reminder.name
        message: reminder.payload.message
        markdown: true
        title: reminder.payload.title
        icon: "https://styles.redditmedia.com/t5_32uhe/styles/communityIcon_xnt6chtnr2j21.png"
        tags: reminder.payload.tags
        priority: reminder.payload.priority
        attach: reminder.payload.attach
        click: "include as stub but do not actually use"
        actions: reminder.payload.actions
        email: "test@x.alj.cx"
        call: "+1222334444"
